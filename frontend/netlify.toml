# Netlify Configuration for VITA-BAND AI (Frontend base folder)
# Team: ALPHA MECHS | Problem Statement: SIH26198

[build]
  publish = "dist"
  command = "npm run build"

# Single-Page Application (SPA) Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
