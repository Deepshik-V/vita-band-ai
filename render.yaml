services:
  - type: web
    name: vita-band-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: OPERATION_MODE
        value: DEMO
      - key: CORS_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"
